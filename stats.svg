<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" role="img" aria-label="Siddhi Verma GitHub stats">
<title>GitHub Stats</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes ringGrow{from{stroke-dashoffset:251}to{stroke-dashoffset:var(--off)}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.row{opacity:0;animation:fadeSlide .5s ease forwards;transform-box:fill-box}
.ring{stroke-dasharray:251;stroke-dashoffset:251;animation:ringGrow 1.4s ease .3s forwards}
.rk{opacity:0;animation:popIn .5s ease 1.6s forwards;transform-box:fill-box;transform-origin:center}
]]></style>
<linearGradient id="sTitle" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff7eb6"/><stop offset="100%" stop-color="#c084fc"/>
</linearGradient>
<linearGradient id="sRing" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff7eb6"/><stop offset="100%" stop-color="#8b5cf6"/>
</linearGradient>
<filter id="sGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="460" height="220" rx="14" fill="#160f26" stroke="#3b2a5c" stroke-width="1.2"/>
<text x="24" y="34" font-size="17" font-weight="800" fill="url(#sTitle)">Siddhi's GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(80,128)">
  <circle r="40" fill="none" stroke="#211538" stroke-width="9"/>
  <circle class="ring" r="40" fill="none" stroke="url(#sRing)" stroke-width="9" stroke-linecap="round"
    transform="rotate(-90)" style="--off:70" filter="url(#sGlow)"/>
  <text class="rk" text-anchor="middle" y="-2" font-size="20" font-weight="800" fill="#ff7eb6">B+</text>
  <text class="rk" text-anchor="middle" y="16" font-size="9" fill="#8b949e">RANK</text>
</g>

<!-- stat rows -->
<g font-size="14">
  <g class="row" style="animation-delay:.2s">
    <text x="170" y="70" fill="#e879f9">★</text>
    <text x="192" y="70" fill="#e6edf3">Total Stars</text>
    <text x="440" y="70" text-anchor="end" font-weight="700" fill="#ff7eb6">1</text>
  </g>
  <g class="row" style="animation-delay:.4s">
    <text x="170" y="98" fill="#c084fc">📦</text>
    <text x="192" y="98" fill="#e6edf3">Public Repos</text>
    <text x="440" y="98" text-anchor="end" font-weight="700" fill="#ff7eb6">16</text>
  </g>
  <g class="row" style="animation-delay:.6s">
    <text x="170" y="126" fill="#8b5cf6">👥</text>
    <text x="192" y="126" fill="#e6edf3">Followers</text>
    <text x="440" y="126" text-anchor="end" font-weight="700" fill="#ff7eb6">1</text>
  </g>
  <g class="row" style="animation-delay:.8s">
    <text x="170" y="154" fill="#ff7eb6">🔀</text>
    <text x="192" y="154" fill="#e6edf3">Following</text>
    <text x="440" y="154" text-anchor="end" font-weight="700" fill="#ff7eb6">2</text>
  </g>
  <g class="row" style="animation-delay:1s">
    <text x="170" y="182" fill="#e879f9">✅</text>
    <text x="192" y="182" fill="#e6edf3">Projects Shipped</text>
    <text x="440" y="182" text-anchor="end" font-weight="700" fill="#ff7eb6">7+</text>
  </g>
</g>
<text x="24" y="206" font-size="9" fill="#5b4a72">updated manually — bump ?v= in README to refresh cache</text>
</svg>
