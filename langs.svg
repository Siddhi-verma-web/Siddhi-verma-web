<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" role="img" aria-label="Siddhi Verma top languages">
<title>Most Used Languages</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes growBar{from{width:0}to{width:var(--w)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bar{width:0;animation:growBar 1.1s cubic-bezier(.2,.8,.3,1) forwards}
.lb{opacity:0;animation:fadeIn .4s ease forwards}
]]></style>
<linearGradient id="lTitle" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff7eb6"/><stop offset="100%" stop-color="#c084fc"/>
</linearGradient>
</defs>

<rect width="460" height="220" rx="14" fill="#160f26" stroke="#3b2a5c" stroke-width="1.2"/>
<text x="24" y="34" font-size="17" font-weight="800" fill="url(#lTitle)">Most Used Languages</text>

<!-- combined bar -->
<g transform="translate(24,54)">
  <rect x="0" y="0" width="412" height="14" rx="7" fill="#211538"/>
  <rect class="bar" x="0" y="0" height="14" rx="7" fill="#ff7eb6" style="--w:152px;animation-delay:.1s"/>
  <rect class="bar" x="152" y="0" height="14" rx="7" fill="#c084fc" style="--w:112px;animation-delay:.25s"/>
  <rect class="bar" x="264" y="0" height="14" rx="7" fill="#8b5cf6" style="--w:74px;animation-delay:.4s"/>
  <rect class="bar" x="338" y="0" height="14" rx="7" fill="#e879f9" style="--w:45px;animation-delay:.55s"/>
  <rect class="bar" x="383" y="0" height="14" rx="7" fill="#fde047" style="--w:29px;animation-delay:.7s"/>
</g>

<g font-size="13">
  <g class="lb" style="animation-delay:.9s"><circle cx="34" cy="98" r="5" fill="#ff7eb6"/><text x="46" y="102" fill="#e6edf3">JavaScript</text><text x="430" y="102" text-anchor="end" fill="#8b949e">37%</text></g>
  <g class="lb" style="animation-delay:1.05s"><circle cx="34" cy="122" r="5" fill="#c084fc"/><text x="46" y="126" fill="#e6edf3">HTML</text><text x="430" y="126" text-anchor="end" fill="#8b949e">27%</text></g>
  <g class="lb" style="animation-delay:1.2s"><circle cx="34" cy="146" r="5" fill="#8b5cf6"/><text x="46" y="150" fill="#e6edf3">CSS</text><text x="430" y="150" text-anchor="end" fill="#8b949e">18%</text></g>
  <g class="lb" style="animation-delay:1.35s"><circle cx="34" cy="170" r="5" fill="#e879f9"/><text x="46" y="174" fill="#e6edf3">TypeScript</text><text x="430" y="174" text-anchor="end" fill="#8b949e">11%</text></g>
  <g class="lb" style="animation-delay:1.5s"><circle cx="34" cy="194" r="5" fill="#fde047"/><text x="46" y="198" fill="#e6edf3">Python</text><text x="430" y="198" text-anchor="end" fill="#8b949e">7%</text></g>
</g>
</svg>
