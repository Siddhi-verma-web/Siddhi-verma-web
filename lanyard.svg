<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="Siddhi Verma ID card lanyard">
<title>Siddhi Verma — swinging ID badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes settle{0%{transform:rotate(0deg) translateY(-660px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(13deg)}46%{transform:rotate(-9deg)}62%{transform:rotate(6deg)}78%{transform:rotate(-3.5deg)}92%{transform:rotate(1.5deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
@keyframes shine{0%{transform:translateX(-340px) skewX(-18deg)}55%,100%{transform:translateX(420px) skewX(-18deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.settle{transform-origin:210px 6px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.2s ease-in-out 3.4s infinite}
.wob{transform-origin:210px 300px;animation:cardWobble 4.2s ease-in-out 3.4s infinite}
.shine{animation:shine 4.5s ease-in-out 3.6s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
]]></style>
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#d6478f"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#d6478f"/>
</linearGradient>
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#1d1330"/><stop offset="100%" stop-color="#140d22"/>
</linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#8b5cf6;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#8b5cf6;#ff7eb6;#c084fc;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#c8ccd6"/><stop offset="45%" stop-color="#8a90a0"/><stop offset="55%" stop-color="#6a7080"/><stop offset="100%" stop-color="#9aa0b0"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".14"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="avatarg"><stop offset="0%" stop-color="#2d1b4e"/><stop offset="100%" stop-color="#140d22"/></radialGradient>
<filter id="glow2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cardClip"><rect x="90" y="288" width="240" height="360" rx="18"/></clipPath>
</defs>

<!-- twinkles in background -->
<g class="tw" style="animation-delay:.3s"><circle cx="60" cy="120" r="1.6" fill="#e879f9"/></g>
<g class="tw" style="animation-delay:1.2s"><circle cx="360" cy="200" r="2" fill="#ff7eb6"/></g>
<g class="tw" style="animation-delay:.8s"><circle cx="40" cy="420" r="1.6" fill="#c084fc"/></g>

<g class="settle">
  <!-- clip -->
  <rect x="192" y="0" width="36" height="16" rx="4" fill="url(#metal)"/>
  <circle cx="210" cy="6" r="6" fill="url(#metal)"/>

  <!-- straps -->
  <path d="M210 6 L150 300" stroke="url(#strapg)" stroke-width="26" stroke-linecap="round"/>
  <path d="M210 6 L270 300" stroke="url(#strapg)" stroke-width="26" stroke-linecap="round"/>
  <text x="210" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#140d22" letter-spacing="1.5" transform="rotate(-63 210 150)">SIDDHI • DEV</text>
  <text x="210" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#140d22" letter-spacing="1.5" transform="rotate(63 210 150)">SIDDHI • DEV</text>

  <!-- ring connector -->
  <circle cx="210" cy="292" r="12" fill="none" stroke="url(#metal)" stroke-width="5"/>

  <g class="sway">
    <g class="wob">
      <!-- card -->
      <rect x="88" y="286" width="244" height="364" rx="20" fill="url(#borderg2)" opacity="0"/>
      <rect x="90" y="288" width="240" height="360" rx="18" fill="url(#cardg)" stroke="url(#cardborder)" stroke-width="2"/>

      <g clip-path="url(#cardClip)">
        <!-- header strip -->
        <rect x="90" y="288" width="240" height="64" fill="#2d1b4e"/>
        <text x="210" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff7eb6" letter-spacing="3">DEVELOPER PASS</text>
        <text x="210" y="338" text-anchor="middle" font-size="9" fill="#9b8ab0" letter-spacing="2">ACCESS: ALL REPOS</text>

        <!-- avatar -->
        <circle cx="210" cy="430" r="58" fill="url(#avatarg)" stroke="#c084fc" stroke-width="2" filter="url(#glow2)"/>
        <text x="210" y="446" text-anchor="middle" font-size="42" font-weight="800" fill="#ff7eb6">SV</text>
        <circle cx="258" cy="472" r="9" fill="#28c840" stroke="#140d22" stroke-width="2.5" class="pulse"/>

        <!-- name -->
        <text x="210" y="516" text-anchor="middle" font-size="24" font-weight="800" fill="url(#nameg2)" filter="url(#glow2)">Siddhi Verma</text>
        <text x="210" y="540" text-anchor="middle" font-size="11" fill="#ff7eb6" font-weight="bold" letter-spacing="2.5">WEB DEVELOPER</text>
        <text x="210" y="558" text-anchor="middle" font-size="10.5" fill="#9b8ab0">@Siddhi-verma-web</text>

        <line x1="100" y1="572" x2="320" y2="572" stroke="#2a1f3d" stroke-width="1"/>

        <!-- barcode + tag -->
        <g transform="translate(100,584)"><rect x="0" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="5.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="9.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="12.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="16.0" y="0" width="4" height="26" fill="#e6edf3" opacity=".85"/><rect x="21.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="26.0" y="0" width="4" height="26" fill="#e6edf3" opacity=".85"/><rect x="31.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="34.5" y="0" width="4" height="26" fill="#e6edf3" opacity=".85"/><rect x="41.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="45.5" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="50.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="54.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="58.5" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="63.5" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="67.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="72.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="76.5" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="81.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="84.0" y="0" width="2.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="89.0" y="0" width="1.5" height="26" fill="#e6edf3" opacity=".85"/><rect x="93.5" y="0" width="4" height="26" fill="#e6edf3" opacity=".85"/></g>
        <text x="320" y="600" text-anchor="end" font-size="8.5" fill="#9b8ab0">REACT • TS</text>
        <text x="320" y="612" text-anchor="end" font-size="8.5" fill="#9b8ab0">HTML • PY</text>

        <!-- holo shine sweep -->
        <rect class="shine" x="82" y="288" width="120" height="360" fill="url(#shineg)"/>
      </g>
    </g>
  </g>
</g>

<defs>
  <linearGradient id="nameg2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e879f9"/><stop offset="100%" stop-color="#ff7eb6"/>
  </linearGradient>
</defs>

<text x="210" y="652" text-anchor="middle" font-size="10" fill="#9b8ab0" opacity="0" style="animation:fadeIn .6s ease 3.6s forwards">— drag me… just kidding, I'm an SVG ♥ —</text>
</svg>
