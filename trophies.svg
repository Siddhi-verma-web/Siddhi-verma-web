<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="940" height="220" role="img" aria-label="Siddhi Verma trophies">
<title>Trophies</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.7)}70%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shine{0%{transform:translateX(-140px) skewX(-18deg)}55%,100%{transform:translateX(190px) skewX(-18deg)}}
.cell{opacity:0;animation:popIn .5s cubic-bezier(.2,.8,.3,1.3) forwards;transform-box:fill-box;transform-origin:center bottom}
.shine{animation:shine 3.6s ease-in-out infinite}
@keyframes barGlow{0%,100%{opacity:.6;filter:brightness(1)}50%{opacity:1;filter:brightness(1.4)}}
.gbar{transform-box:fill-box;transform-origin:center;animation:barGlow 2.4s ease-in-out infinite}
]]></style>
<linearGradient id="tGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="tPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff9fc4"/><stop offset="100%" stop-color="#ff7eb6"/></linearGradient>
<linearGradient id="tPurp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c9a3fc"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="shn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cc0"><rect x="14" y="14" width="140" height="192" rx="14"/></clipPath>
<clipPath id="cc1"><rect x="168" y="14" width="140" height="192" rx="14"/></clipPath>
<clipPath id="cc2"><rect x="322" y="14" width="140" height="192" rx="14"/></clipPath>
<clipPath id="cc3"><rect x="476" y="14" width="140" height="192" rx="14"/></clipPath>
<clipPath id="cc4"><rect x="630" y="14" width="140" height="192" rx="14"/></clipPath>
<clipPath id="cc5"><rect x="784" y="14" width="140" height="192" rx="14"/></clipPath>
<filter id="barBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="940" height="220" rx="16" fill="#160f26" stroke="#3b2a5c" stroke-width="1.2"/>

<!-- 6 trophy cells -->
<g>
  <!-- Repositories -->
  <g class="cell" style="animation-delay:.1s">
    <rect x="14" y="14" width="140" height="192" rx="14" fill="#211538" stroke="#3b2a5c"/>
    <text x="84" y="42" text-anchor="middle" font-size="11" fill="#8b949e">Repositories</text>
    <path transform="translate(84,90)" d="M-22 -14 h44 v10 l-6 26 h-32 l-6 -26 z" fill="url(#tPink)"/>
    <text x="84" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#ff7eb6">C</text>
    <text x="84" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#e6edf3">16</text>
    <text x="84" y="170" text-anchor="middle" font-size="9" fill="#5b4a72">total repos</text>
    <rect class="gbar" x="52" y="192" width="64" height="5" rx="2.5" fill="#ff7eb6" filter="url(#barBlur)" style="animation-delay:0.0s"/>
    <rect x="52" y="192" width="64" height="5" rx="2.5" fill="#ff7eb6"/>
    <g clip-path="url(#cc0)"><rect class="shine" y="14" width="70" height="192" fill="url(#shn)"/></g>
  </g>
  <!-- Stars -->
  <g class="cell" style="animation-delay:.25s">
    <rect x="168" y="14" width="140" height="192" rx="14" fill="#211538" stroke="#3b2a5c"/>
    <text x="238" y="42" text-anchor="middle" font-size="11" fill="#8b949e">Stars</text>
    <path transform="translate(238,90)" d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z" fill="url(#tGold)"/>
    <text x="238" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#fde68a">S</text>
    <text x="238" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#e6edf3">1</text>
    <text x="238" y="170" text-anchor="middle" font-size="9" fill="#5b4a72">stars earned</text>
    <rect class="gbar" x="206" y="192" width="64" height="5" rx="2.5" fill="#fde047" filter="url(#barBlur)" style="animation-delay:0.15s"/>
    <rect x="206" y="192" width="64" height="5" rx="2.5" fill="#fde047"/>
    <g clip-path="url(#cc1)"><rect class="shine" y="14" width="70" height="192" fill="url(#shn)" style="animation-delay:.3s"/></g>
  </g>
  <!-- Followers -->
  <g class="cell" style="animation-delay:.4s">
    <rect x="322" y="14" width="140" height="192" rx="14" fill="#211538" stroke="#3b2a5c"/>
    <text x="392" y="42" text-anchor="middle" font-size="11" fill="#8b949e">Followers</text>
    <circle cx="392" cy="88" r="20" fill="url(#tPurp)"/>
    <text x="392" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#c9a3fc">F</text>
    <text x="392" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#e6edf3">1</text>
    <text x="392" y="170" text-anchor="middle" font-size="9" fill="#5b4a72">people following</text>
    <rect class="gbar" x="360" y="192" width="64" height="5" rx="2.5" fill="#c9a3fc" filter="url(#barBlur)" style="animation-delay:0.3s"/>
    <rect x="360" y="192" width="64" height="5" rx="2.5" fill="#c9a3fc"/>
    <g clip-path="url(#cc2)"><rect class="shine" y="14" width="70" height="192" fill="url(#shn)" style="animation-delay:.6s"/></g>
  </g>
  <!-- Experience -->
  <g class="cell" style="animation-delay:.55s">
    <rect x="476" y="14" width="140" height="192" rx="14" fill="#211538" stroke="#3b2a5c"/>
    <text x="546" y="42" text-anchor="middle" font-size="11" fill="#8b949e">Experience</text>
    <rect x="524" y="72" width="44" height="34" rx="6" fill="url(#tPink)"/>
    <rect x="536" y="64" width="20" height="12" rx="3" fill="url(#tPink)"/>
    <text x="546" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#ff7eb6">E</text>
    <text x="546" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#e6edf3">Final Yr</text>
    <text x="546" y="170" text-anchor="middle" font-size="9" fill="#5b4a72">CSE student</text>
    <rect class="gbar" x="514" y="192" width="64" height="5" rx="2.5" fill="#60a5fa" filter="url(#barBlur)" style="animation-delay:0.44999999999999996s"/>
    <rect x="514" y="192" width="64" height="5" rx="2.5" fill="#60a5fa"/>
    <g clip-path="url(#cc3)"><rect class="shine" y="14" width="70" height="192" fill="url(#shn)" style="animation-delay:.9s"/></g>
  </g>
  <!-- Projects -->
  <g class="cell" style="animation-delay:.7s">
    <rect x="630" y="14" width="140" height="192" rx="14" fill="#211538" stroke="#3b2a5c"/>
    <text x="700" y="42" text-anchor="middle" font-size="11" fill="#8b949e">Projects</text>
    <rect x="678" y="70" width="44" height="36" rx="5" fill="url(#tGold)"/>
    <circle cx="700" cy="88" r="7" fill="#211538"/>
    <text x="700" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#fde68a">P</text>
    <text x="700" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#e6edf3">7+</text>
    <text x="700" y="170" text-anchor="middle" font-size="9" fill="#5b4a72">shipped live</text>
    <rect class="gbar" x="668" y="192" width="64" height="5" rx="2.5" fill="#ff9fc4" filter="url(#barBlur)" style="animation-delay:0.6s"/>
    <rect x="668" y="192" width="64" height="5" rx="2.5" fill="#ff9fc4"/>
    <g clip-path="url(#cc4)"><rect class="shine" y="14" width="70" height="192" fill="url(#shn)" style="animation-delay:1.2s"/></g>
  </g>
  <!-- Open to Work -->
  <g class="cell" style="animation-delay:.85s">
    <rect x="784" y="14" width="140" height="192" rx="14" fill="#211538" stroke="#3b2a5c"/>
    <text x="854" y="42" text-anchor="middle" font-size="11" fill="#8b949e">Status</text>
    <circle cx="854" cy="88" r="20" fill="#211538" stroke="#22a83f" stroke-width="3"/>
    <circle cx="854" cy="88" r="7" fill="#22a83f"/>
    <text x="854" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#22a83f">✓</text>
    <text x="854" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#e6edf3">Open</text>
    <text x="854" y="170" text-anchor="middle" font-size="9" fill="#5b4a72">to work</text>
    <rect class="gbar" x="822" y="192" width="64" height="5" rx="2.5" fill="#4ade80" filter="url(#barBlur)" style="animation-delay:0.75s"/>
    <rect x="822" y="192" width="64" height="5" rx="2.5" fill="#4ade80"/>
    <g clip-path="url(#cc5)"><rect class="shine" y="14" width="70" height="192" fill="url(#shn)" style="animation-delay:1.5s"/></g>
  </g>
</g>
</svg>
